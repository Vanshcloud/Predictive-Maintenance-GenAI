# =============================================================================
# Documentation checks
# =============================================================================
# WHY: this repository is documentation-heavy — a spec, an architecture guide,
# a metrics reference, and 15 devlog entries that cross-link constantly. Files
# have been moved twice. A broken relative link is invisible until a reader
# hits it, and the reader is the person we are trying not to lose.
# =============================================================================

name: Docs

on:
  push:
    branches: [main]
    paths: ["**.md", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["**.md", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  links:
    name: Relative links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check every relative markdown link
        # Deliberately checks RELATIVE links only. External URLs are checked
        # separately below and are allowed to fail without blocking: a third
        # party's outage is not a defect in this repository.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          def anchors(md):
              # GitHub's heading slugs: lowercase, punctuation dropped, spaces
              # to hyphens, repeats numbered. Fenced code is not a heading.
              found, seen, fenced = set(), {}, False
              for line in md.read_text(encoding="utf-8").splitlines():
                  if line.lstrip().startswith("```"):
                      fenced = not fenced
                  heading = None if fenced else re.match(r"#{1,6}\s+(.*?)\s*#*\s*$", line)
                  if heading:
                      slug = re.sub(r"<[^>]+>", "", heading.group(1)).strip().lower()
                      slug = re.sub(r"[^\w\- ]", "", slug).replace(" ", "-")
                      found.add(slug if slug not in seen else f"{slug}-{seen[slug]}")
                      seen[slug] = seen.get(slug, 0) + 1
                  found.update(re.findall(r'<a (?:name|id)="([^"]+)"', line))
              return found

          broken = []
          for path in pathlib.Path(".").rglob("*.md"):
              if any(p in path.parts for p in (".git", "venv", ".venv", "node_modules")):
                  continue
              text = path.read_text(encoding="utf-8")
              # Markdown links and HTML href attributes. The README's nav bar is
              # HTML, and its "#quick-start" pointed at a heading that did not
              # exist — invisible to a check that read only markdown links and
              # discarded every #fragment.
              links = [(m.group(0), m.group(2)) for m in re.finditer(r"\[([^\]]*)\]\(([^)\s]+)\)", text)]
              links += [(m.group(0), m.group(1)) for m in re.finditer(r'href="([^"]+)"', text)]
              for shown, link in links:
                  if link.startswith(("http://", "https://", "mailto:")):
                      continue
                  target, _, fragment = link.partition("#")
                  resolved = (path.parent / target).resolve() if target else path.resolve()
                  if not resolved.exists():
                      broken.append(f"{path}: {shown}")
                  elif fragment and resolved.suffix == ".md" and fragment.lower() not in anchors(resolved):
                      broken.append(f"{path}: {shown}  (no such heading)")

          if broken:
              print(f"{len(broken)} broken relative link(s):\n")
              print("\n".join(f"  {b}" for b in broken))
              sys.exit(1)
          print("All relative links resolve.")
          PY

  external:
    name: External links (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never blocks. A link rots because someone else moved a page, which is
    # worth knowing about and is not a reason to fail this repository's build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --exclude-path venv
            --exclude-path .venv
            --accept 200,206,403,429
            "**/*.md"
          fail: false
